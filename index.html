const shots=[],effects=[],eyes=[];const violet=new THREE.MeshStandardMaterial({color:0xb35aff,emissive:0x6b1ed2,emissiveIntensity:1.1,transparent:true,opacity:.95}),blue=new THREE.MeshStandardMaterial({color:0x5be9ff,emissive:0x158ecb,emissiveIntensity:1.5,transparent:true,opacity:.96});let now=0,atkReady=0,skillReady=0,ultReady=0,boostReady=0,armed=false,ultEnd=0,nextEye=0,eyeCount=0,camYaw=0;
function spawnShot(pos,dir,isBlue=false){const mesh=new THREE.Mesh(new THREE.OctahedronGeometry(isBlue?.24:.19,0),(isBlue?blue:violet).clone());mesh.position.copy(pos);scene.add(mesh);shots.push({mesh,vel:dir.clone().normalize().multiplyScalar(isBlue?10:12),life:2.1})}

const pad=document.getElementById('pad'),nub=document.getElementById('nub');let stickX=0,stickY=0,pid=null;function moveStick(e){const r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,scale=Math.min(1,43/Math.max(1,Math.hypot(dx,dy)));stickX=dx*scale/43;stickY=dy*scale/43;nub.style.transform=`translate(${stickX*36}px,${stickY*36}px)`}pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;pad.setPointerCapture(pid);moveStick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)moveStick(e)});function release(e){if(e.pointerId!==pid)return;pid=null;stickX=stickY=0;nub.style.transform=''}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
