<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ibaz Test — Prototype 01</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111323;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;top:env(safe-area-inset-top,12px);left:12px;color:#fff;text-shadow:0 2px 5px #000;font-size:14px;pointer-events:none}#hud strong{font-size:19px}#hint{opacity:.75;font-size:12px;margin-top:5px}#pad{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:25px;width:135px;height:135px;border:2px solid #ffffff55;border-radius:50%;background:#ffffff14;touch-action:none}#nub{position:absolute;width:54px;height:54px;left:39px;top:39px;border-radius:50%;background:#b6a1ff99;border:2px solid #ffffff99}#attack{position:fixed;right:24px;bottom:calc(47px + env(safe-area-inset-bottom));height:88px;width:88px;border-radius:50%;background:#6b46d1bb;border:2px solid #d7c6ff;color:white;font-weight:700;font-size:14px;touch-action:none}#status{position:fixed;bottom:calc(7px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#ffffffb5;font-size:11px;white-space:nowrap;pointer-events:none}</style></head><body>
<div id="hud"><strong>IBAZ TEST 💎</strong><div>Прототип 01 · 3D-арена</div><div id="hint">Левый круг — движение · кнопка — кристаллы</div></div><div id="pad"><div id="nub"></div></div><button id="attack">💎<br>АТАКА</button><div id="status">Временная модель · нужен интернет для Three.js</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x18162c);scene.fog=new THREE.Fog(0x18162c,18,52);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb9c6ff,0x363044,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-5,12,8);scene.add(sun);
const floor=new THREE.Mesh(new THREE.CircleGeometry(18,64),new THREE.MeshStandardMaterial({color:0x33314b,roughness:.85}));floor.rotation.x=-Math.PI/2;scene.add(floor);const rings=new THREE.Mesh(new THREE.RingGeometry(16.8,17.2,64),new THREE.MeshBasicMaterial({color:0x9b7de2,side:THREE.DoubleSide}));rings.rotation.x=-Math.PI/2;rings.position.y=.015;scene.add(rings);
const grid=new THREE.GridHelper(32,24,0x6b5d92,0x48405f);grid.position.y=.025;scene.add(grid);
const player=new THREE.Group();scene.add(player);const skin=new THREE.MeshStandardMaterial({color:0xf0d9e4});const suit=new THREE.MeshStandardMaterial({color:0x222047,metalness:.15,roughness:.6});const hair=new THREE.MeshStandardMaterial({color:0xc6b8e2});
function part(g,m,x,y,z){const a=new THREE.Mesh(g,m);a.position.set(x,y,z);player.add(a);return a}
part(new THREE.CapsuleGeometry(.31,.8,4,8),suit,0,1.27,0);part(new THREE.SphereGeometry(.27,12,10),skin,0,2.12,0);part(new THREE.SphereGeometry(.29,12,10),hair,0,2.28,-.07);for(const x of [-.16,.16]){part(new THREE.CapsuleGeometry(.105,.65,3,7),suit,x,.48,0);part(new THREE.CapsuleGeometry(.085,.62,3,7),suit,x*2.25,1.43,0)}
const crystalMat=new THREE.MeshStandardMaterial({color:0xa88aff,emissive:0x4a2a9a,emissiveIntensity:.65,metalness:.25,roughness:.23,transparent:true,opacity:.9});const crystals=[];
function crystal(x,z,size=1){const mesh=new THREE.Mesh(new THREE.ConeGeometry(.24*size,1.7*size,5),crystalMat.clone());mesh.position.set(x,.85*size,z);mesh.rotation.z=(Math.random()-.5)*.35;scene.add(mesh);crystals.push({mesh,ttl:1.35});}
let attackCooldown=0;function attack(){if(attackCooldown>0)return;attackCooldown=.45;for(let i=0;i<5;i++){const d=1.3+i*.55;const a=player.rotation.y;crystal(player.position.x-Math.sin(a)*d+(Math.random()-.5)*.35,player.position.z-Math.cos(a)*d+(Math.random()-.5)*.35,.65+Math.random()*.5)}}document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
const pad=document.getElementById('pad'),nub=document.getElementById('nub');let stickX=0,stickY=0,pid=null;function moveStick(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,scale=Math.min(1,50/Math.max(1,Math.hypot(dx,dy)));stickX=dx*scale/50;stickY=dy*scale/50;nub.style.transform=`translate(${stickX*40}px,${stickY*40}px)`}pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;pad.setPointerCapture(pid);moveStick(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)moveStick(e)});function release(e){if(e.pointerId!==pid)return;pid=null;stickX=stickY=0;nub.style.transform=''}pad.addEventListener('pointerup',release);pad.addEventListener('pointercancel',release);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')attack()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);let x=stickX+(keys.d?1:0)-(keys.a?1:0),y=stickY+(keys.s?1:0)-(keys.w?1:0);const l=Math.hypot(x,y);if(l>.08){x/=Math.max(l,1);y/=Math.max(l,1);player.position.x=THREE.MathUtils.clamp(player.position.x+x*dt*4,-15,15);player.position.z=THREE.MathUtils.clamp(player.position.z+y*dt*4,-15,15);player.rotation.y=Math.atan2(-x,-y)}attackCooldown=Math.max(0,attackCooldown-dt);for(let i=crystals.length-1;i>=0;i--){const c=crystals[i];c.ttl-=dt;c.mesh.material.opacity=Math.min(.9,c.ttl*1.7);if(c.ttl<=0){scene.remove(c.mesh);c.mesh.geometry.dispose();c.mesh.material.dispose();crystals.splice(i,1)}}const target=new THREE.Vector3(player.position.x,4.6,player.position.z+7.6);camera.position.lerp(target,Math.min(1,dt*5));camera.lookAt(player.position.x,1.25,player.position.z);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
